<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全国大会標準チェッカー 2026</title>
  <style>
    :root{
      --bg:#0d1426; --panel:#111c33; --panel2:#162642; --card:#f8fbff;
      --ink:#eef6ff; --muted:#98abc7; --line:#263a5f; --accent:#00c4ff;
      --accent2:#2dd4bf; --warn:#ff8a4c; --ok:#20c77a; --paper:#ffffff;
      --paperInk:#132033; --paperMuted:#61708a; --paperLine:#dfe7f2;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
    header{padding:18px 16px 14px;background:linear-gradient(180deg,#14213d,#0d1426);border-bottom:1px solid var(--line)}
    .wrap{width:min(1120px,100%);margin:0 auto}
    h1{margin:0;font-size:clamp(22px,5vw,38px);line-height:1.15;letter-spacing:0}
    .lead{margin:8px 0 0;color:var(--muted);font-size:13px}
    .viewCounter{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;background:#0b1222;border:1px solid #31496f;border-radius:999px;color:var(--muted);font-size:12px;font-weight:800}
    .viewCounter strong{color:var(--accent);font-size:14px}
    main{padding:14px 12px 34px}
    .app{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .controls{padding:14px;display:grid;gap:12px}
    label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:800}
    select,input{width:100%;min-width:0;height:46px;border:1px solid #31496f;border-radius:6px;background:#0b1222;color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
    select:focus,input:focus{outline:3px solid rgba(0,196,255,.22);border-color:var(--accent)}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0b1222;border:1px solid #31496f;border-radius:6px;padding:4px;height:46px}
    .seg button,.chip,button.primary{border:0;border-radius:5px;font:inherit;font-weight:900;cursor:pointer}
    .seg button{background:transparent;color:var(--muted)}
    .seg button.active{background:var(--accent);color:#00111a}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:#0b1222;color:var(--muted);border:1px solid #31496f;padding:8px 10px;font-size:12px}
    .chip.active{background:#0f3b56;border-color:var(--accent);color:#dff7ff}
    button.primary{height:46px;background:var(--accent2);color:#001c19;width:100%}
    .toggle{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:800}
    .toggle input{width:18px;height:18px}
    .results{display:grid;gap:12px}
    .summary{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .metric{background:#0b1222;border:1px solid #273b60;border-radius:8px;padding:10px}
    .metric small{display:block;color:var(--muted);font-size:11px;font-weight:900}
    .metric strong{display:block;margin-top:2px;font-size:22px;line-height:1.15}
    .list{display:grid;gap:10px}
    .card{background:var(--paper);color:var(--paperInk);border:1px solid var(--paperLine);border-radius:8px;padding:13px;display:grid;gap:9px}
    .cardTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .meet{font-weight:900;font-size:16px}
    .meta{color:var(--paperMuted);font-size:12px;font-weight:800}
    .std{font-size:28px;font-weight:950;line-height:1}
    .status{display:inline-flex;align-items:center;justify-content:center;min-height:30px;border-radius:999px;padding:3px 10px;font-weight:950;font-size:13px;white-space:nowrap}
    .ok{background:#e7f8ef;color:#087143;border:1px solid #9ce2bf}
    .near{background:#fff4e9;color:#ad4e1f;border:1px solid #ffc299}
    .clearLine{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .diff{font-size:14px;font-weight:900;color:var(--paperInk)}
    .empty{background:var(--panel);border:1px dashed #355176;color:var(--muted);border-radius:8px;padding:20px;text-align:center;font-weight:800}
    footer{color:var(--muted);font-size:11px;line-height:1.7;margin-top:14px}
    a{color:#8bdfff}
    @media (max-width:860px){
      .app{grid-template-columns:1fr}
      .summary{grid-template-columns:1fr 1fr}
      .metric:last-child{grid-column:1/-1}
    }
    @media (max-width:520px){
      header{padding:16px 13px 12px}
      main{padding:10px 10px 28px}
      .controls{padding:12px}
      .grid2{grid-template-columns:1fr 1fr}
      .summary{grid-template-columns:1fr 1fr;gap:8px;padding:10px}
      .metric{padding:9px}
      .metric strong{font-size:20px}
      .card{padding:12px}
      .std{font-size:26px}
      .cardTop{align-items:flex-start}
      .chips{gap:6px}
      .chip{padding:7px 8px}
    }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>全国大会標準チェッカー 2026</h1>
    <p class="lead">日本水泳連盟の2026年標準記録をもとに、入力タイムで突破状況を確認できます。</p>
    <div class="viewCounter" id="viewCounter" hidden>👀 のべ閲覧 <strong id="viewCount">-</strong> 回</div>
  </div></header>
  <main class="wrap">
    <div class="app">
      <section class="panel">
        <div class="controls">
          <label>男女
            <div class="seg" id="genderSeg"><button data-gender="male" class="active">男子</button><button data-gender="female">女子</button></div>
          </label>
          <label>水路
            <div class="seg" id="courseSeg"><button data-course="lc" class="active">長水路</button><button data-course="sc">短水路</button></div>
          </label>
          <div class="grid2">
            <label>年齢
              <input id="age" inputmode="numeric" value="16" min="6" max="99">
            </label>
            <label>国スポ区分
              <select id="kokuspoDivision"><option value="all">すべて</option><option>少年B</option><option>少年A</option><option>成年</option></select>
            </label>
          </div>
          <div class="grid2">
            <label>種目
              <select id="stroke"></select>
            </label>
            <label>距離
              <select id="distance"></select>
            </label>
          </div>
          <label>タイム
            <input id="time" inputmode="decimal" placeholder="例 52.19 / 1:02.34">
          </label>
          <label>大会カテゴリ
            <div class="chips" id="groupChips"></div>
          </label>
          <label class="toggle"><input type="checkbox" id="clearedOnly"> 突破だけ表示</label>
          <button class="primary" id="sample" type="button">例を入力</button>
        </div>
      </section>
      <section class="results">
        <div class="summary">
          <div class="metric"><small>入力タイム</small><strong id="metricTime">-</strong></div>
          <div class="metric"><small>突破</small><strong id="metricCleared">-</strong></div>
          <div class="metric"><small>最も近い標準</small><strong id="metricNearest">-</strong></div>
        </div>
        <div class="list" id="results"></div>
      </section>
    </div>
    <footer>
      出典: 公益財団法人日本水泳連盟 2026年標準記録ページ。<br>
      &copy; 2026 gyojin600m1 無断複製・再配布を禁じます。
    </footer>
  </main>

    const STROKES = [
  [
    "fr",
    "自由形"
  ],
  [
    "ba",
    "背泳ぎ"
  ],
  [
    "br",
    "平泳ぎ"
  ],
  [
    "fly",
    "バタフライ"
  ],
  [
    "im",
    "個人メドレー"
  ]
];
    const GROUP_LABELS = {
  "all": "すべて",
  "junior": "小中・JOC",
  "high": "高校",
  "university": "大学",
  "open": "日本選手権・JO",
  "kokuspo": "国スポ"
};
    const DIVISION_LABELS = {
  "10": "10歳",
  "11": "11歳",
  "12": "12歳",
  "13": "13歳",
  "14": "14歳",
  "9under": "9歳以下",
  "15_16": "15-16歳",
  "cs": "CS",
  "少年B": "少年B",
  "少年A": "少年A",
  "成年": "成年"
};
    const state = { gender:"male", course:"lc", stroke:"fr", distance:50, group:"all" };
    const $ = (id)=>document.getElementById(id);
    function normalizeTimeInput(t){
      let s=String(t||"").normalize("NFKC").trim().replace(/[，、]/g,".").replace(/\s+/g,"");
      const dotMinute=s.match(/^(\d+)\.(\d{2})\.(\d{1,2})$/);
      if(dotMinute) s=dotMinute[1]+":"+dotMinute[2]+"."+dotMinute[3];
      return s;
    }
    function toSec(t){ const s=normalizeTimeInput(t); if(!s) return NaN; if(s.includes(":")){ const [m,sec]=s.split(":").map(Number); return Number.isFinite(m)&&Number.isFinite(sec)&&sec>=0&&sec<60?m*60+sec:NaN; } const n=Number(s); return Number.isFinite(n)&&n>0?n:NaN; }
    function fmt(sec){ if(!Number.isFinite(sec)) return "-"; const sign=sec<0?"-":""; sec=Math.abs(sec); const m=Math.floor(sec/60); const s=sec-m*60; return sign+(m?m+":"+s.toFixed(2).padStart(5,"0"):s.toFixed(2)); }
    function strokeName(key){ return STROKES.find(s=>s[0]===key)?.[1] || key; }
    function jocDivForAge(age){ if(!Number.isFinite(age)) return ""; if(age<=9) return "9under"; if(age<=14) return String(age); if(age<=16) return "15_16"; return "csOnly"; }
    function divisionLabel(entry){ return DIVISION_LABELS[entry.division] || entry.division || ""; }
    function setup(){
      $("stroke").innerHTML = STROKES.map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("");
      $("groupChips").innerHTML = Object.entries(GROUP_LABELS).map(([k,v])=>'<button class="chip '+(k==="all"?"active":"")+'" data-group="'+k+'" type="button">'+v+'</button>').join("");
      document.querySelectorAll("[data-gender]").forEach(b=>b.addEventListener("click",()=>{state.gender=b.dataset.gender; document.querySelectorAll("[data-gender]").forEach(x=>x.classList.toggle("active",x===b)); fillDistances(); render();}));
      document.querySelectorAll("[data-course]").forEach(b=>b.addEventListener("click",()=>{state.course=b.dataset.course; document.querySelectorAll("[data-course]").forEach(x=>x.classList.toggle("active",x===b)); fillDistances(); render();}));
      document.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{state.group=b.dataset.group; document.querySelectorAll("[data-group]").forEach(x=>x.classList.toggle("active",x===b)); render();}));
      ["age","time","kokuspoDivision","clearedOnly"].forEach(id=>$(id).addEventListener("input", render));
      $("stroke").addEventListener("change",()=>{state.stroke=$("stroke").value; fillDistances(); render();});
      $("distance").addEventListener("change",()=>{state.distance=Number($("distance").value); render();});
      $("sample").addEventListener("click",()=>{$("time").value="52.19"; $("age").value="17"; state.gender="male"; state.course="lc"; state.stroke="fr"; state.distance=100; syncControls(); fillDistances(); render();});
      syncControls(); fillDistances(); render();
    }
    function syncControls(){
      $("stroke").value=state.stroke;
      document.querySelectorAll("[data-gender]").forEach(x=>x.classList.toggle("active",x.dataset.gender===state.gender));
      document.querySelectorAll("[data-course]").forEach(x=>x.classList.toggle("active",x.dataset.course===state.course));
    }
    function fillDistances(){
      const distances = [...new Set(ENTRIES.filter(e=>e.gender===state.gender && e.stroke===state.stroke && e.course===state.course).map(e=>e.distance))].sort((a,b)=>a-b);
      $("distance").innerHTML = distances.map(d=>'<option value="'+d+'">'+d+'m</option>').join("");
      if(!distances.includes(state.distance)) state.distance = distances[0] || 50;
      $("distance").value=state.distance;
    }
    function filteredEntries(){
      const age=Number($("age").value);
      const jocDiv=jocDivForAge(age);
      const kokuspoDiv=$("kokuspoDivision").value;
      return ENTRIES.filter(e=>{
        if(e.gender!==state.gender || e.course!==state.course || e.stroke!==state.stroke || e.distance!==state.distance) return false;
        if(state.group!=="all" && e.group!==state.group) return false;
        if(e.ageMode==="joc" && jocDiv==="csOnly" && e.division!=="cs") return false;
        if(e.ageMode==="joc" && jocDiv && jocDiv!=="csOnly" && !(e.division===jocDiv || e.division==="cs")) return false;
        if(e.ageMode==="kokuspo" && kokuspoDiv!=="all" && e.division!==kokuspoDiv) return false;
        return true;
      });
    }
    function render(){
      const sec=toSec($("time").value);
      $("metricTime").textContent=Number.isFinite(sec)?fmt(sec):"-";
      const rows=filteredEntries().map(e=>{ const standard=toSec(e.standard); return {...e, standardSec:standard, diff:Number.isFinite(sec)?sec-standard:NaN}; });
      const evaluated=rows.filter(r=>Number.isFinite(r.diff));
      const cleared=evaluated.filter(r=>r.diff<=0);
      $("metricCleared").textContent=Number.isFinite(sec)?cleared.length+"件":"-";
      const nearest=evaluated.filter(r=>r.diff>0).sort((a,b)=>a.diff-b.diff)[0] || evaluated.sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff))[0];
      $("metricNearest").textContent=nearest?(nearest.diff<=0?"突破済み":fmt(nearest.diff)+"差"):"-";
      let shown=rows;
      if($("clearedOnly").checked && Number.isFinite(sec)) shown=shown.filter(r=>r.diff<=0);
      shown.sort((a,b)=>{
        if(Number.isFinite(a.diff)&&Number.isFinite(b.diff)){
          const ac=a.diff<=0, bc=b.diff<=0;
          if(ac!==bc) return ac?-1:1;
          return ac ? a.diff-b.diff : a.diff-b.diff;
        }
        return a.meetName.localeCompare(b.meetName,"ja");
      });
      $("results").innerHTML = shown.length ? shown.map(cardHtml).join("") : '<div class="empty">該当する標準記録がありません。</div>';
    }
    function cardHtml(r){
      const hasTime=Number.isFinite(r.diff);
      const cleared=hasTime && r.diff<=0;
      const label=divisionLabel(r);
      const course=r.course==="lc"?"長水路":"短水路";
      const status=!hasTime?"タイム未入力":cleared?"突破":"あと "+fmt(r.diff);
      const diff=!hasTime?"標準との差を表示します":cleared?fmt(-r.diff)+" 速い":fmt(r.diff)+" 足りない";
      return '<article class="card">'+
        '<div class="cardTop"><div><div class="meet">'+r.meetName+'</div><div class="meta">'+course+(label?" / "+label:"")+' / '+strokeName(r.stroke)+' '+r.distance+'m</div></div><div class="std">'+r.standard+'</div></div>'+
        '<div class="clearLine"><span class="status '+(cleared?"ok":"near")+'">'+status+'</span><span class="diff">'+diff+'</span></div>'+
      '</article>';
    }
    setup();
  </script>
  <script>
    // 閲覧カウンター: Abacus(無料API)に累計値を保存。1日1回だけ加算し、失敗時は非表示のまま。
    (function(){
      const NS="gyojin600m1-swim-standard-checker";
      const isLocal=location.protocol==="file:"||/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)||location.hostname==="";
      const KEY=isLocal?"views-dev":"views";
      const d=new Date();
      const today=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const stampKey="viewCounterStamp:"+KEY;
      let counted=false;
      try{counted=localStorage.getItem(stampKey)===today;}catch(e){}
      fetch("https://abacus.jasoncameron.dev/"+(counted?"get":"hit")+"/"+NS+"/"+KEY)
        .then(r=>{if(!r.ok)throw new Error();return r.json();})
        .then(data=>{
          if(typeof data.value!=="number")throw new Error();
          document.getElementById("viewCount").textContent=data.value.toLocaleString("ja-JP");
          document.getElementById("viewCounter").hidden=false;
          if(!counted){try{localStorage.setItem(stampKey,today);}catch(e){}}
        })
        .catch(()=>{});
    })();
  </script>
